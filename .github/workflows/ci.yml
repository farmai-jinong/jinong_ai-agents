# 푸시·PR 마다 ruff + pytest(네트워크·비밀 불필요: llm/smoke 마커는 pyproject addopts 로 제외).
# 배포 게이트는 deploy/deploy.sh 가 로컬에서 같은 명령을 다시 돈다 — 여기 통과가 배포 전제.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q
