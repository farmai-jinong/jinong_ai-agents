# 병해충 정도(severity) → 발생단계 인덱스 규칙 — 데이터. 로직은 severity.py.
#
# 표준 6단계: 0 미발생 | 1 2%미만 | 2 5%미만 | 3 10%미만 | 4 30%미만 | 5 30%이상 (설명서 §3.3).
# %가 원문에 있으면 pct_to_step 이 우선(스펙 고정, 코드에 있음). 없으면 아래 규칙.
#
# 이 파일은 자가 개선 루프(app/agents/voice_eval/optimize)가 수정할 수 있는 튜닝 표면이다.
# 바꾸면 tests/agents/test_severity.py 와 골든 렌더 테스트가 바로 잡아낸다.

# LLM 이 판정한 severity 라벨 → 단계. raw_hints 가 하나도 안 맞을 때 쓰인다.
word_step:
  경미: 1
  보통: 2
  심함: 4
  불명: 1

# 원문(severity_raw)의 구어 표현 → 단계. **순서대로 먼저 맞는 것이 이긴다** (강한 표현을 위에 둘 것).
raw_hints:
  - {step: 5, pattern: '(전멸|다\s*죽|절반|반\s*이상|엄청|심각|아주\s*많|너무\s*많|번졌|퍼졌|온\s*하우스)'}
  - {step: 4, pattern: '(많이|많다|많아|심하|심해|꽤|제법|여기저기)'}
  - {step: 3, pattern: '(군데군데|몇\s*군데|일부|어느\s*정도|중간)'}
  - {step: 1, pattern: '(조금|약간|살짝|몇\s*개|한두|한\s*두|초기|시작|보이기\s*시작)'}

# 구어 힌트와 LLM 판정이 이 값보다 크게 벌어지면 LLM 판정을 쓰고 경고를 남긴다.
disagreement_tolerance: 2
