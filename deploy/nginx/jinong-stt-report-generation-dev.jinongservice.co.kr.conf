# 호스트 nginx vhost(dev) — jinong-stt-report-generation-dev.jinongservice.co.kr → dev 에이전트(127.0.0.1:7013). prod conf 의 사본(docs/ops.md §7).
# 설치 위치: /etc/nginx/sites.d/jinong-stt-report-generation-dev.jinongservice.co.kr.conf (지농서버 입주사 공통 패턴, jinong-stt conf 참조).
# TLS: per-tenant certbot(webroot) — deploy/letsencrypt/cert.sh (→ /srv/jinong-agent-dev/letsencrypt).
# ⚠️ 최초 발급: cert 파일이 없으면 nginx -t 가 실패한다 → HTTPS 블록을 주석 처리한 채 reload →
#    cert.sh 로 발급(포트 80 acme-challenge) → 주석 해제 → reload.
# 전제: 컨테이너가 AGENT_BIND=127.0.0.1:7013 (기본) 으로 루프백 바인드.

upstream jinong-agent-dev {
    server 127.0.0.1:7013;   # apps/jinong_ai-agents-dev docker-compose (AGENT_BIND)
}

server {
    listen 80;
    server_name jinong-stt-report-generation-dev.jinongservice.co.kr;

    access_log /srv/jinong-agent-dev/logs/nginx_access.log combined;
    error_log  /srv/jinong-agent-dev/logs/nginx_error.log warn;

    include include/server-base.conf;

    # letsencrypt(webroot) acme 검증 경로(공개)
    location ~ /.well-known/acme-challenge {
        allow all;
        root /srv/jinong-agent-dev/letsencrypt/data;
    }

    # ── HTTPS 블록(최초 발급 전에는 이 블록 주석) ──────────────────────────
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    ssl_certificate     /srv/jinong-agent-dev/letsencrypt/etc/live/jinong-stt-report-generation-dev.jinongservice.co.kr/fullchain.pem;
    ssl_certificate_key /srv/jinong-agent-dev/letsencrypt/etc/live/jinong-stt-report-generation-dev.jinongservice.co.kr/privkey.pem;

    include include/ssl.conf;
    include include/redirect-to-https.conf;
    # ── HTTPS 블록 끝 ────────────────────────────────────────────────────

    # JSON 이벤트만 받는다(오디오는 S3 참조) — 업로드 상한 작게
    client_max_body_size 4m;

    location / {
        proxy_pass http://jinong-agent-dev;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout      120s;    # 라우트는 모두 즉시 응답(202/200); 생성은 백그라운드
        proxy_send_timeout      120s;
        proxy_buffering         off;
        proxy_redirect          off;
    }
}
